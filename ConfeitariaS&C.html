<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConfeitariaS&C - LOGIN</title>
  <link rel="stylesheet" href="Confeitaria.css">
</head>
<body>
  <div class="caixa-login">
    <img src="logoConfeitaria.png" class="logo-confeitaria" alt="Logo da Confeitaria S&C">
  
    <form id="formLogin" action="login.php" method="POST">
     
      <input type="text" name="usuario" placeholder="E-MAIL/USUÁRIO" required>
  
      <input type="password" name="senha" placeholder="SENHA" required>
      
      <p>Escolha o perfil:</p>
      
      <label class="opcao-perfil">
        <input type="radio" name="perfil" value="administrador" required> Administrador
      </label>
      <label class="opcao-perfil">
        <input type="radio" name="perfil" value="confeiteiro"> Confeiteiro
      </label>
      <label class="opcao-perfil">
        <input type="radio" name="perfil" value="entregador"> Entregador
      </label>
      
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
